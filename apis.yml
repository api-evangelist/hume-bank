    type: APIReference
  - url: openapi/hume-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorized Consumer Data Right Payees API conforming to the
    Australian Consumer Data Standards (CDS). Covers Get Payees and Get Payee Detail
    (/banking/payees and /banking/payees/{payeeId}), returning a customer's saved
    payees. Access requires consumer consent through an Accredited Data Recipient
    under the CDR ADR model; the endpoint is live and authorization-gated behind the
    CDR consent flow.
