    type: APIReference
  - url: openapi/hume-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorized Consumer Data Right Direct Debits and Scheduled
    Payments API conforming to the Australian Consumer Data Standards (CDS). Covers
    Get Direct Debits (bulk and per-account) and Get Scheduled Payments (bulk and
    per-account) across /banking/accounts/direct-debits, /banking/accounts/{accountId}/direct-debits,
    /banking/payments/scheduled and /banking/accounts/{accountId}/payments/scheduled.
    Access requires consumer consent through an Accredited Data Recipient under the
    CDR ADR model; endpoints are live and authorization-gated.
