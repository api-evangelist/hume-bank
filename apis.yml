    type: APIReference
  - url: openapi/hume-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Public, unauthenticated Consumer Data Right Product Reference Data API
    conforming to the Australian Consumer Data Standards (CDS). Confirmed live returning
    HTTP 200 with 25 products (x-v 4) at the CDR-registered base https://ibankob.humebank.com.au/OpenBanking,
    covering Hume Bank's retail and business term deposits, savings/transaction accounts,
    home loans, personal loans, and credit card products with rates, fees, and eligibility.
