name: Hume Bank
kind: company
description: Hume Bank is a customer-owned (mutual) Australian bank headquartered in
  Albury, New South Wales. Founded in 1955 as the Hume Co-operative Building & Investment
  Society, it became Hume Building Society and then Hume Bank on 1 July 2014, serving
  roughly 65,000 customers with around A$1.70 billion in assets. As an authorised
  deposit-taking institution (ADI) it participates in Australia's Consumer Data Right
  (CDR / Open Banking) regime, exposing a public, unauthenticated Product Reference
  Data (PRD) API built to the Consumer Data Standards for its retail and business
  deposit and credit card products, alongside the accredited-data-recipient consent
  flows required of a CDR data holder.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
